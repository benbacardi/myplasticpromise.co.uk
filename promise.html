<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Plastic Promise - Certificate of Commitment</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Global Styles */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            /* background-color: #f4f7f6; */
            margin: 0;
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Certificate Container */
        .certificate-container {
            max-width: 800px;
            padding: 40px;
            background-color: #ffffff;
            border: 12px double #2e7d32;
            /* Eco green double border */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            text-align: center;
            box-sizing: border-box;
        }

        /* Inner Decorative Border */
        .certificate-inner {
            border: 2px solid #a5d6a7;
            height: 100%;
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* Typography */
        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #2e7d32;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .title {
            font-family: 'Chewy', 'Georgia', serif;
            font-size: 38px;
            color: #1b5e20;
            margin: 10px 0 5px 0;
        }

        .subtitle {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #757575;
            margin-bottom: 25px;
        }

        .presented-to {
            font-style: italic;
            font-family: 'Georgia', serif;
            color: #616161;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .user-name {
            font-family: 'Georgia', serif;
            font-size: 32px;
            font-weight: bold;
            color: #212121;
            border-bottom: 2px solid #2e7d32;
            padding-bottom: 5px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .promise-text {
            font-size: 16px;
            line-height: 1.6;
            color: #424242;
            margin: 0 auto;
        }

        .promise-highlight {
            font-weight: bold;
            color: #2e7d32;
            font-style: italic;
        }

        /* Footer & Signatures */
        .certificate-footer {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 30px;
            padding: 0 40px;
            box-sizing: border-box;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @media (max-width: 600px) {
            .certificate-footer {
                flex-direction: column;
                gap: 20px;
            }
        }

        .line {
            width: 100%;
            border-top: 1px solid #bdbdbd;
            margin-bottom: 5px;
        }

        .meta-label {
            font-size: 12px;
            text-transform: uppercase;
            color: #757575;
            letter-spacing: 1px;
        }

        .signature-target {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 16px;
            color: #2e7d32;
            height: 25px;
        }

        /* Action Button */
        .print-btn {
            margin-top: 25px;
            padding: 12px 30px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background 0.2s ease;
        }

        .print-btn:hover {
            background-color: #1b5e20;
        }

        /* Print Media Queries */
        @media print {
            body {
                background-color: #ffffff;
                padding: 0;
                margin: 0;
            }

            .print-btn {
                display: none;
                /* Hides the button when printing */
            }

            .certificate-container {
                box-shadow: none;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                border-width: 12px;
                /* Ensures border prints sharply */
            }
        }
    </style>
</head>

<body>

    <!-- Certificate Container -->
    <div class="certificate-container">
        <div class="certificate-inner">

            <!-- Header -->
            <div class="logo">My Plastic Promise</div>

            <!-- Titles -->
            <div>
                <div class="title">
                    <span class="light-blue">Certificate</span>
                    <span class="bright-green">of</span>
                    <span class="dark-blue">Commitment</span>
                </div>
                <div class="subtitle">An Official Pledge for the Planet</div>
            </div>

            <!-- Recipient -->
            <div>
                <div class="presented-to">This certificate is proudly presented to</div>
                <div id="user-name" class="user-name">&nbsp;</div>
            </div>

            <!-- The Promise -->
            <div class="promise-text">
                for officially committing to help save the planet by reducing plastic pollution.
                <!--<br />
                By making this promise, they have pledged to:
                <br>
                <span class="promise-highlight">"[Insert Chosen Promise/Commitment Here, e.g., Eliminate single-use
                    plastic bottles from my daily routine]"</span>
                -->
            </div>

            <!-- Footer / Signatures -->
            <div class="certificate-footer">
                <div class="meta-item">
                    <div class="signature-target" id="current-date"> </div>
                    <div class="line"></div>
                    <div class="meta-label">Date Issued</div>
                </div>
                <!--<div class="meta-item">
                    <div class="signature-target">Our Shared Planet</div>
                    <div class="line"></div>
                    <div class="meta-label">Witnessed By</div>
                </div>-->
            </div>

        </div>
    </div>

    <!-- Print Button -->
    <button class="print-btn" onclick="window.print()">Print Certificate</button>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const name = params.get('name').trim();

            if (name) {
                document.getElementById('user-name').textContent = name;
            }

            const today = new Date().toLocaleDateString();
            document.getElementById('current-date').textContent = today;

        });
    </script>

</body>

</html>
