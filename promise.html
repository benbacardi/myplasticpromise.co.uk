<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9ZXGSFNQD3"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-9ZXGSFNQD3');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Plastic Promise</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">

    <script src="https://unpkg.com/alpinejs" defer></script>

</head>

<body>

    <div class="content">

        <h1>
            <span class="light-blue">My</span>
            <span class="bright-green">Plastic</span>
            <span class="dark-blue">Promise</span>
        </h1>

        <div class="header">
            <h2>Thank you for making your promise, <span id="user-name"></span>!</h2>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const name = params.get('name');

            if (name) {
                document.getElementById('user-name').textContent = name;
            }
        });
    </script>

</body>

</html>
