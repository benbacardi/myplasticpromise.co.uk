<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Plastic Promise</title>

    <style>
        :root {
            --background: #f4f8f7;
            --primary: #0f4c5c;
            --accent: #2ec4b6;
            --text: #1f2937;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(
                135deg,
                var(--background),
                #ffffff
            );
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
        }

        .hero {
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 800;
            line-height: 1;
            color: var(--primary);
            letter-spacing: -0.04em;
        }

        .highlight {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <main class="hero">
        <h1>
            My Plastic
            <span class="highlight">Promise</span>
        </h1>
    </main>
</body>
</html>
